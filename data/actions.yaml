# Типовые первичные действия.
#
# Итоговая рекомендация по заявке собирается из трёх источников:
#   1. общие действия по приоритету (кого уведомить, в какой срок реагировать);
#   2. действия по особым признакам (угроза безопасности, работы после ТО и т.п.);
#   3. типовые проверки по типу оборудования — они в equipment.yaml.
# Модель выбирает из этих списков подходящее к конкретной заявке и связно
# формулирует рекомендацию. Свои технические действия она не придумывает.

by_priority:
  critical:
    - Немедленно уведомить сменного диспетчера и мастера участка
    - Направить дежурную бригаду на место
  high:
    - Уведомить мастера участка
    - Запланировать выезд бригады в течение 2 часов
  medium:
    - Включить заявку в план работ текущей смены
  low:
    - Рассмотреть заявку в плановом порядке

by_flag:
  safety_risk:
    - Остановить оборудование, если это безопасно, и оградить опасную зону
    - Работы проводить только по наряду-допуску
  line_stopped:
    - Сообщить начальнику смены о простое линии для перепланирования производства
  after_maintenance:
    - Привлечь бригаду, выполнявшую последнее ТО, и проверить перечень выполненных работ
  repeated_request:
    - Найти предыдущую заявку по этой проблеме и проверить, что по ней было сделано
  equipment_stopped_by_operator:
    - Не запускать оборудование повторно до осмотра специалистом

by_fault_category:
  instrumentation:
    - Сверить показания датчика с переносным прибором
    - Проверить кабель и подключение датчика, при необходимости заменить или откалибровать датчик
  control_system:
    - Снять журнал ошибок контроллера или терминала и зафиксировать коды ошибок
    - Проверить линии связи и сетевое оборудование
  electrical:
    - Проверить электропитание и срабатывание защит

by_request_type:
  improvement:
    - Подготовить технико-экономическое обоснование предложения
    - Оценить энергопотребление текущего привода и доступные альтернативы
