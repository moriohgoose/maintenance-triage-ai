# Справочник оборудования (вымышленное предприятие).
#
# Критичность оборудования:
#   A — остановка останавливает производственную линию, резерва нет
#   B — важное оборудование, есть резерв или обходной путь
#   C — вспомогательное оборудование
#
# department — подразделение, которое по умолчанию обслуживает эту единицу.
# Правила маршрутизации (rules.yaml) могут перенаправить заявку в другую
# службу, например неисправность датчика уходит в КИПиА.

# Типы оборудования и типовые проверки. Это база знаний для рекомендаций:
# модель выбирает из этих проверок подходящие к симптомам, а не придумывает свои.
equipment_types:
  pump:
    label: Насос
    typical_checks:
      - Виброметрия, проверка состояния подшипников
      - Проверка центровки насоса и электродвигателя
      - Проверка на кавитацию — давление на входе, засор всасывающей линии
      - Осмотр торцевых уплотнений и сальников на протечки
      - Проверка крепления к фундаменту

  conveyor:
    label: Ленточный конвейер
    typical_checks:
      - Осмотр ленты, стыков и натяжения
      - Проверка роликоопор и барабанов на заклинивание
      - Проверка срабатывания защит — схода ленты, пробуксовки, аварийного троса
      - Проверка привода — редуктор, муфта, электродвигатель
      - Проверка датчиков и журнала событий системы управления

  crusher:
    label: Дробилка
    typical_checks:
      - Осмотр камеры дробления на попадание недробимых (металлических) предметов
      - Проверка футеровки, брони и крепёжных элементов
      - Проверка подшипниковых узлов и системы смазки
      - Проверка эксцентрикового вала и приводных ремней

  excavator:
    label: Карьерный экскаватор
    typical_checks:
      - Проверка уровня и состояния гидравлической жидкости
      - Проверка и очистка радиаторов маслоохладителей
      - Проверка работы вентиляторов системы охлаждения
      - Проверка гидронасосов и предохранительных клапанов
      - Замена гидравлических фильтров по необходимости

  compressor:
    label: Компрессор
    typical_checks:
      - Проверка цепи питания и пускателя, срабатывания тепловой защиты
      - Проверка электродвигателя — сопротивление изоляции, обмотки
      - Проверка уровня масла и охлаждающей жидкости
      - Осмотр системы охлаждения, патрубков и соединений на протечки

  ventilation_unit:
    label: Вентиляционная установка
    typical_checks:
      - Проверка и замена воздушных фильтров
      - Проверка натяжения и износа приводных ремней
      - Осмотр рабочего колеса и воздуховодов на засорение
      - Проверка положения заслонок и клапанов

  loader:
    label: Погрузчик
    typical_checks:
      - Проверка уровня и состояния гидравлической жидкости
      - Проверка гидронасоса и давления в гидросистеме
      - Проверка гидрораспределителя и предохранительного клапана
      - Проверка мощности двигателя под нагрузкой — топливная система, воздушный фильтр

  diesel_engine:
    label: Дизельный двигатель
    typical_checks:
      - Проверка работ, выполненных на последнем ТО, — правильность сборки и регулировок
      - Проверка топливной системы — фильтры, подсос воздуха, форсунки
      - Проверка воздушного фильтра и впускного тракта
      - Проверка датчиков и регулятора оборотов

  drilling_rig:
    label: Буровая установка
    typical_checks:
      - Проверка кабелей и разъёмов линии связи
      - Проверка радиомодема или сетевого оборудования
      - Анализ журнала ошибок терминала и контроллера
      - Проверка электропитания терминала

