# Справочник подразделений, которым могут назначаться заявки.
# Ключ (например, mechanical_service) — внутренний код, его используют правила
# и код программы. Поле name — то, что видит пользователь.

departments:
  mechanical_service:
    name: Механическая служба
    scope: Ремонт стационарного механического оборудования — насосы, конвейеры, дробилки, компрессоры, вентиляция

  mobile_equipment_service:
    name: Служба ремонта горной и самоходной техники
    scope: Экскаваторы, погрузчики, буровые установки — механика, гидравлика, двигатели, электрооборудование машин

  power_service:
    name: Энергослужба
    scope: Электродвигатели, пускатели, шкафы управления, кабели, электропитание стационарного оборудования

  instrumentation_service:
    name: Служба КИПиА
    scope: Датчики, измерительные приборы, их калибровка (контрольно-измерительные приборы и автоматика)

  automation_service:
    name: Служба АСУ ТП
    scope: Системы управления, контроллеры, связь оборудования с диспетчерской, терминалы и коды ошибок

  chief_engineer_office:
    name: Отдел главного механика
    scope: Модернизация, предложения по улучшению, плановая замена оборудования

  dispatcher:
    name: Диспетчерская служба (ручной разбор)
    scope: Заявки, которые не удалось классифицировать автоматически, и обращения, не связанные с ремонтом
